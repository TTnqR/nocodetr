<!DOCTYPE html><html><head><title>Kategoriler</title></head>
<body><h1>Kategori Sayfası</h1>
<button onclick="filter('bubble')">Bubble</button>
<button onclick="filter('webflow')">Webflow</button>
<div id='list'>
<div class='bubble'>Bubble Makale</div><div class='webflow'>Webflow Makale</div>
</div>
<script>
function filter(c){document.querySelectorAll('#list div').forEach(x=>x.style.display=x.className==c?'block':'none')}
</script></body></html>
